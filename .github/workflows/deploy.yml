name: Build Containers, Push to Docker Hub

on:
  push:
    branches: [ main, test, dev ]

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.find.outputs.frontend }}
      backend:  ${{ steps.find.outputs.backend }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Find changed files
        id: find
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} || true)
          echo "frontend=$([[ $CHANGED =~ ^frontend/ ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "backend=$([[ $CHANGED =~ ^backend/ ]] && echo true || echo false)" >> $GITHUB_OUTPUT
    
      - name: Set version        
        id: version
        run: |
          VERSION=$(date +%Y.%m.%d.%H%M%S)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-frontend:
    needs: preflight
    if: needs.preflight.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
            platforms: linux/amd64,linux/arm64
            push: true
            tags: ${{ vars.DOCKERHUB_USERNAME }}/tictactoe-frontend:${{github.ref_name}}-${{ needs.preflight.outputs.version }}